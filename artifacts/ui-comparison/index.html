<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlanCraft · 01~06 Before / After</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;padding:28px;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1A1A1A;background:#FBF9F6}header{max-width:1500px;margin:0 auto 24px;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:24px;letter-spacing:-.6px;margin:0 0 9px}p{font-size:13px;color:#7A7067;line-height:1.9;margin:0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls select{font:inherit;font-size:12px;padding:12px;border:1px solid #EBE7E0;border-radius:7px;background:#fff;color:#7A7067}.tabs{display:flex;gap:6px;padding:4px;border:1px solid #EBE7E0;border-radius:8px}.tabs button{font:inherit;cursor:pointer;font-size:12px;padding:10px 15px;border:0;border-radius:5px;color:#7A7067;background:transparent}.tabs button[aria-pressed=true]{background:#FCEEF3;color:#B8405F}.pair{max-width:1500px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:22px}figure{margin:0;min-width:0}figcaption{font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:12px}.tag{display:inline-flex;padding:5px 9px;border:1px solid #EBE7E0;border-radius:4px;color:#7A7067;font-size:11px}.after .tag{background:#FCEEF3;color:#B8405F;border-color:#efcbd5}figure img{width:100%;height:auto;display:block;border:1px solid #EBE7E0;border-radius:8px;background:#fff}.pair.mobile{max-width:850px}a{color:inherit}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #D4547A;outline-offset:4px}footer{max-width:1500px;margin:22px auto 0}footer p{font-size:12px}footer a{color:#B8405F;text-underline-offset:4px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:900px){header{align-items:flex-start;flex-direction:column}.controls{width:100%;justify-content:space-between}}@media(max-width:700px){body{padding:20px 14px}h1{font-size:21px}.pair{grid-template-columns:1fr;gap:24px}.tabs button{padding:10px 15px}p{font-size:12px}.controls{gap:10px}.controls select{font-size:12px}}
</style></head><body><header><div><h1 id="title">02 · 문제 정의</h1><p>각 단계의 Before·After는 같은 입력 내용과 화면 크기로 촬영했습니다.<br>이미지를 누르면 원본 크기로 볼 수 있습니다. <span id="size">PC · 1440 × 1000 · 전체 페이지</span></p></div><div class="controls"><label for="stage" class="sr">비교할 단계</label><select id="stage"><option value="1">01 · 아이디어 발굴</option><option value="2" selected>02 · 문제 정의</option><option value="3">03 · 이해관계자 분석</option><option value="4">04 · 기능 설계</option><option value="5">05 · 기획서 작성</option><option value="6">06 · 최종 검토</option></select><div class="tabs" role="group" aria-label="비교 화면 크기"><button data-mode="desktop" aria-pressed="true">PC 비교</button><button data-mode="mobile" aria-pressed="false">모바일 비교</button></div></div></header><main class="pair" id="pair"><figure><figcaption><span class="tag">BEFORE</span> 변경 전</figcaption><a id="before-link" href="step02-before-desktop.png" target="_blank"><img id="before" src="step02-before-desktop.png" alt="변경 전 문제 정의 페이지"></a></figure><figure class="after"><figcaption><span class="tag">AFTER</span> 변경 후</figcaption><a id="after-link" href="step02-after-desktop.png" target="_blank"><img id="after" src="step02-after-desktop.png" alt="변경 후 문제 정의 페이지"></a></figure></main><footer><p>기존 색상·로고 유지 · 단계별 사용 안내 · 연결된 작성 영역 · 짧은 AI 대화 · 저장 후 단계 이동</p><p><a href="http://localhost:3000/dashboard?type=general">실제 프로젝트 목록 열기</a></p></footer><script>
(()=>{const titles=["아이디어 발굴","문제 정의","이해관계자 분석","기능 설계","기획서 작성","최종 검토"];let mode="desktop";const select=document.getElementById("stage");const query=Number(new URLSearchParams(location.search).get("step"));if(query>=1&&query<=6)select.value=String(query);function render(){const num=Number(select.value),key=String(num).padStart(2,"0");document.getElementById("title").textContent=key+" · "+titles[num-1];document.getElementById("size").textContent=mode==="mobile"?"모바일 · 390 × 844 · 전체 페이지":"PC · 1440 × 1000 · 전체 페이지";document.getElementById("pair").classList.toggle("mobile",mode==="mobile");for(const state of ["before","after"]){const file="step"+key+"-"+state+"-"+mode+".png";document.getElementById(state).src=file;document.getElementById(state).alt=(state==="before"?"변경 전 ":"변경 후 ")+titles[num-1]+" 페이지";document.getElementById(state+"-link").href=file;}}select.addEventListener("change",render);document.querySelectorAll("[data-mode]").forEach(button=>button.addEventListener("click",()=>{mode=button.dataset.mode;document.querySelectorAll("[data-mode]").forEach(other=>other.setAttribute("aria-pressed",String(other===button)));render();}));render();})();
</script></body></html>
