<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlanCraft · 가이드 Before / After</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;padding:28px;font-family:"Malgun Gothic",sans-serif;color:#1A1A1A;background:#FBF9F6}header,main,footer{max-width:1500px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:25px}h1{font-size:24px;margin:0 0 10px}p{font-size:13px;color:#7A7067;line-height:1.9}select{font:inherit;font-size:12px;background:#fff;border:1px solid #EBE7E0;color:#7A7067;padding:12px;border-radius:6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.pair.mobile{max-width:850px}figure{margin:0;min-width:0}figcaption{font-size:12px;margin-bottom:12px}strong{display:inline-block;margin-right:10px;padding:5px 9px;border:1px solid #EBE7E0;border-radius:4px;font-size:11px}.after strong{background:#FCEEF3;color:#B8405F}img{display:block;width:100%;height:auto;border:1px solid #EBE7E0;border-radius:7px}a{color:#B8405F}footer{margin-top:24px}a:focus-visible,select:focus-visible{outline:2px solid #B8405F;outline-offset:4px}@media(max-width:700px){body{padding:20px 14px}header{align-items:flex-start;flex-direction:column}.pair{grid-template-columns:1fr}h1{font-size:21px}}
</style></head><body>
<header><div><h1>사용 가이드 · Horizontal Scroll</h1><p>기존 색상과 로고를 유지하고, 6단계를 가로로 넘겨 읽는 구성으로 변경했습니다.<br>같은 화면 크기에서 촬영한 전체 페이지입니다. 이미지를 누르면 원본이 열립니다.</p></div><label>화면 <select id="mode"><option value="desktop">PC · 1440 × 1000</option><option value="mobile">모바일 · 390 × 844</option></select></label></header>
<main class="pair" id="pair"><figure><figcaption><strong>BEFORE</strong>변경 전</figcaption><a id="before-link" href="guide-before-desktop.png" target="_blank"><img id="before" src="guide-before-desktop.png" alt="변경 전 사용 가이드"></a></figure><figure class="after"><figcaption><strong>AFTER</strong>변경 후</figcaption><a id="after-link" href="guide-after-desktop.png" target="_blank"><img id="after" src="guide-after-desktop.png" alt="변경 후 사용 가이드"></a></figure></main>
<footer><p>휠·스와이프·단계 선택·방향키 탐색 · 단계별 결과물 예시 · 움직임 줄이기 설정 지원</p><p><a href="http://localhost:3000/guide">실제 가이드 열기</a> · <a href="dashboard.html">대시보드 비교</a> · <a href="index.html">01~06 단계 비교</a></p></footer>
<script>(()=>{const mode=document.getElementById('mode');mode.addEventListener('change',()=>{document.getElementById('pair').classList.toggle('mobile',mode.value==='mobile');for(const state of ['before','after']){const file='guide-'+state+'-'+mode.value+'.png';document.getElementById(state).src=file;document.getElementById(state+'-link').href=file;}})})();</script>
</body></html>
